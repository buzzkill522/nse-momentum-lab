name: backtest

on:
  push:
    paths: ["backtest.py", "trader.py", ".github/workflows/backtest.yml"]
  workflow_dispatch:
    inputs:
      years:
        description: "Years to test"
        default: "5"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python backtest.py ${{ inputs.years || '5' }}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: docs/backtest.json
