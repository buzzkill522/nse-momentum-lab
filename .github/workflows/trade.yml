name: paper-trade

on:
  schedule:
    # Hourly, Mon–Fri, 10:00–15:00 IST (04:30–09:30 UTC), plus once after the 15:30 close.
    # The first run is at 10:00, not the 9:15 open, because opening prices are the jumpiest.
    - cron: "30 4-9 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset portfolio to fresh capital"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: trade

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python trader.py ${{ inputs.reset && '--reset' || '' }}
      - name: Commit state
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/state-*.json docs/trades-*.csv
          git diff --cached --quiet || git commit -m "Update portfolio $(date -u +%FT%TZ)"
          git pull --rebase
          git push
